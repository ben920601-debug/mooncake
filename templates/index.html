<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>中秋烤肉地圖</title>
  <meta name="description" content="中秋夜，看看附近誰在烤肉、哪裡賣煙火。發起、申請加入、邀請附近的人、打卡上傳照片。">
  <meta name="theme-color" content="#121833">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f6d98b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ asset('css/style.css') }}">
</head>
<body>
<div class="app">
  <section class="mapwrap" aria-label="地圖">
    <div id="map"></div>
    <div class="maptop">
      <div class="brand">中秋烤肉地圖<small>今晚哪裡在烤肉、哪裡有煙火</small></div>
    </div>
    <div class="mapctl">
      <button class="btn round" id="locateBtn" title="定位我" aria-label="定位我">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <div class="legend" aria-hidden="true"><span><i class="lg-bbq"></i>烤肉</span><span><i class="lg-fw"></i>賣煙火</span><span><i class="lg-me"></i>我</span><span><i class="lg-ppl"></i>附近的人</span></div>
    <div class="placebar" id="placebar" hidden><p id="placetext"></p><button class="btn sm moon" id="placeOk">用這個位置</button><button class="btn sm ghost" id="placeCancel">取消</button></div>
  </section>

  <aside class="panel">
    <div class="me" id="me"></div>
    <div class="actions" id="actions"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="scroll" id="scroll"></div>
  </aside>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
  window.APP_CONFIG = {
    firebase: {{ firebase_config | tojson }},
    demo: {{ demo_mode | tojson }},
    eventHours: {{ event_hours | tojson }},
    tiles: {{ tiles | tojson }}
  };
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="{{ asset('js/app.js') }}"></script>
</body>
</html>
